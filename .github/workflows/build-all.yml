name: Build All Platforms (custom branches)

permissions: write-all

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['1.5.0-loginapi-fix', '1.5.0-hidecm']

jobs:
  build-all:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name == '1.5.0-hidecm' && 'custom-hidecm' || 'custom' }}
